<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
:root{--bg:#0b0b0c;--fg:#f1ece4;--mut:rgba(244,241,234,.58);--line:rgba(255,255,255,.1);--card:#141415;--ac:#EAE3D6;--acf:#111;--r:14px;--ok:#58c27d;--bad:#e5645c;--fb:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fh:var(--fb)}
body{background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:15px;line-height:1.45;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
img{display:block;max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* ---------- botões e campos (compartilhados) ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:calc(var(--r) - 2px);border:1px solid var(--line);font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn.bad{color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.inp{width:100%;height:46px;padding:0 14px;background:transparent;border:1px solid var(--line);border-radius:calc(var(--r) - 2px);outline:none;transition:.15s}
textarea.inp{height:auto;padding:12px 14px;resize:vertical;min-height:84px}
.inp:focus{border-color:var(--ac)}
.hint{font-size:12.5px;color:var(--mut)}
.err{font-size:13px;color:var(--bad);margin-top:6px}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}
.sp{flex:1}

/* ---------- toast / modal ---------- */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#fff;color:#111;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:92vw;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:#2a1210;color:#ffb4ae;border:1px solid #5a2420}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.mdl{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:24px 22px calc(22px + env(safe-area-inset-bottom));animation:up .25s}
.mdl h3{font-family:var(--fh);font-size:20px;margin-bottom:16px}
@media(min-width:640px){.ov{align-items:center}.mdl{border-radius:22px}}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(24px);opacity:0}}

/* =====================================================
   PÁGINA PÚBLICA DA BARBEARIA (.shop) — tema por variáveis
   ===================================================== */
.shop{background:var(--bg);color:var(--fg);font-family:var(--fb);position:relative;min-height:100vh;--fh:var(--fb)}
.shop.f-classica{--fh:'Playfair Display',Georgia,'Times New Roman',serif}
.shop.f-impacto{--fh:'Oswald','Arial Narrow',Impact,sans-serif}
.shop.sq{--r:3px}
.shop h1,.shop h2,.shop h3{font-family:var(--fh)}
.shop.f-impacto h1,.shop.f-impacto h2{text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.shop.f-classica h1{font-weight:600;letter-spacing:-.01em}
.shop.f-moderna h1{font-weight:700;letter-spacing:-.03em}
.hero{position:relative}
.cover{height:clamp(230px,44vh,420px);position:relative;overflow:hidden;background:color-mix(in srgb,var(--ac) 14%,var(--bg))}
.cover img{width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.18) 0%,transparent 35%,var(--bg) 100%)}
.cover.ph{background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--ac) 30%,var(--bg)) 0%,var(--bg) 70%)}
.idb{position:relative;margin-top:-58px;padding:0 24px 8px;text-align:center;max-width:640px;margin-inline:auto}
.logo{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;background:var(--card);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.25);overflow:hidden;display:grid;place-items:center}
.shop.sq .logo{border-radius:6px}
.logo img{width:100%;height:100%;object-fit:cover}
.logo span{font-family:var(--fh);font-size:38px;color:var(--ac);line-height:1}
.idb h1{font-size:clamp(30px,7vw,46px);line-height:1.05}
.idb .desc{margin-top:12px;color:var(--mut);font-size:15.5px;max-width:460px;margin-inline:auto}
.idb .meta{margin-top:14px;display:flex;gap:6px 18px;justify-content:center;flex-wrap:wrap;font-size:13.5px;color:var(--mut)}
.idb .meta span,.idb .meta a{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.idb .meta svg{width:15px;height:15px;stroke:var(--ac);fill:none;stroke-width:1.8}
.hero-cta{margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.shop .btn{border-color:var(--line)}
.shop .btn.pri{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.shop .btn.big{height:54px;padding:0 34px;font-size:16px;box-shadow:0 8px 30px -8px var(--ac)}
.shop .inp{border-color:var(--line)}
.shop .inp:focus{border-color:var(--ac)}
.sh-main{max-width:640px;margin:0 auto;padding:30px 24px 130px}
.sec{margin-top:42px}
.sec:first-child{margin-top:12px}
.sec>h2{font-size:13px;font-family:var(--fb)!important;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--mut);margin-bottom:6px}
.svc{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:18px 0;border-bottom:1px solid var(--line);transition:.15s}
.svc:hover .svn{color:var(--ac)}
.svc .tx{flex:1;min-width:0}
.svn{font-family:var(--fh);font-size:19px;transition:.15s}
.shop.f-impacto .svn{text-transform:uppercase;letter-spacing:.04em}
.svd{font-size:13px;color:var(--mut);margin-top:2px}
.svp{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.team{display:flex;gap:20px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.team::-webkit-scrollbar{display:none}
.tm{flex:0 0 auto;width:84px;text-align:center}
.tm .av{width:68px;height:68px;margin:0 auto 8px;border-radius:50%;overflow:hidden;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ac);font-family:var(--fh);font-size:24px}
.shop.sq .tm .av{border-radius:6px}
.tm .av img{width:100%;height:100%;object-fit:cover}
.tm b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r)}
@media(min-width:560px){.gal{grid-template-columns:repeat(3,1fr)}}
.hrs{margin-top:8px}
.hrs div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.hrs div span:last-child{color:var(--mut);font-variant-numeric:tabular-nums}
.hrs .off span:last-child{opacity:.6}
.pw{text-align:center;font-size:12px;color:var(--mut);margin-top:56px;letter-spacing:.04em}
.pw a{text-decoration:none;color:var(--fg);font-weight:600}
.ctab{position:sticky;bottom:0;padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 55%,transparent);display:flex;justify-content:center;z-index:20;pointer-events:none;opacity:0;transform:translateY(16px);transition:.3s}
.ctab.on{opacity:1;transform:none}
.ctab.on .btn{pointer-events:auto}
.ctab .btn{width:100%;max-width:420px}
.shop.pv .ctab{display:none}
.shop.pv{min-height:0;height:100%;overflow:auto;border-radius:26px}
.shop.pv .cover{height:210px}
.shop.pv .sh-main{padding-bottom:30px}
.shop.pv .ctab{position:sticky}
.shop.pv .idb{padding-inline:18px}
.shop.pv .idb h1{font-size:30px}
.mylink{margin-top:14px;font-size:13px;color:var(--mut);text-decoration:underline;text-underline-offset:3px}

/* assistente de agendamento (sheet) */
.shop .ov{align-items:flex-end}
.shop .mdl{background:var(--bg);border-color:var(--line);padding-top:20px}
.bk-top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.bk-top h3{margin:0;flex:1;font-size:21px}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;line-height:1}
.prog{display:flex;gap:5px;margin:10px 0 20px}
.prog i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--ac)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;margin-bottom:10px;border:1px solid var(--line);border-radius:var(--r);transition:.15s}
.opt:hover{border-color:var(--mut)}
.opt.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 9%,transparent)}
.opt .tx{flex:1;min-width:0}
.opt b{font-weight:600;display:block}
.opt small{color:var(--mut);font-size:13px}
.opt .av{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--card);display:grid;place-items:center;color:var(--ac);font-family:var(--fh);flex:none}
.opt .av img{width:100%;height:100%;object-fit:cover}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;margin-inline:-22px;padding-inline:22px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dy{flex:0 0 58px;padding:10px 0;border:1px solid var(--line);border-radius:var(--r);text-align:center;line-height:1.25;transition:.15s}
.dy small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.dy b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.dy em{display:block;font-style:normal;font-size:10.5px;color:var(--mut);text-transform:uppercase}
.dy.on{background:var(--ac);border-color:var(--ac);color:var(--acf)}
.dy.on small,.dy.on em{color:inherit;opacity:.75}
.dy[disabled]{opacity:.28;pointer-events:none}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:380px){.slots{grid-template-columns:repeat(3,1fr)}}
.sl{height:44px;border:1px solid var(--line);border-radius:calc(var(--r) - 4px);font-variant-numeric:tabular-nums;font-weight:500;transition:.15s}
.sl:hover{border-color:var(--ac)}
.sl.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.sl[disabled]{opacity:.28;text-decoration:line-through;pointer-events:none}
.sum{border:1px solid var(--line);border-radius:var(--r);padding:4px 16px;margin-bottom:18px}
.sum div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.sum div:last-child{border:0}
.sum span:first-child{color:var(--mut)}
.sum span:last-child{text-align:right;font-weight:500}
.bk-foot{display:flex;gap:10px;margin-top:20px}
.bk-foot .btn{flex:1}.bk-foot .btn.bk{flex:0 0 auto}
.ok-ic{width:64px;height:64px;border-radius:50%;margin:8px auto 18px;background:color-mix(in srgb,var(--ac) 16%,transparent);display:grid;place-items:center}
.ok-ic svg{width:30px;height:30px;stroke:var(--ac);fill:none;stroke-width:2.4}
.center{text-align:center}
.empty{padding:28px 8px;text-align:center;color:var(--mut);font-size:14px}
.sk{height:62px;border-radius:var(--r);background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200% 100%;animation:sk 1.3s infinite;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}

.auth .wm{--mh:44px;--wh:22px;gap:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.land{max-width:980px;margin:0 auto;padding:22px 24px 60px;min-height:100vh;display:flex;flex-direction:column}
.land nav{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.land .hh{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:620px;padding:60px 0}
.land h1{font-size:clamp(38px,8vw,68px);line-height:1.02;letter-spacing:-.04em;font-weight:700}
.land h1 em{font-style:normal;color:var(--mut)}
.land p.lead{margin-top:20px;font-size:18px;color:var(--mut);max-width:480px}
.land .cta{margin-top:30px;display:flex;gap:10px;flex-wrap:wrap}
.pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:20px}
.pt{border:1px solid var(--line);border-radius:var(--r);padding:20px;background:var(--card)}
.pt b{display:block;margin-bottom:6px}.pt span{font-size:14px;color:var(--mut)}
.auth{max-width:400px;margin:0 auto;padding:40px 24px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.auth .wm{margin-bottom:34px}
.auth h2{font-size:26px;letter-spacing:-.03em;margin-bottom:6px}
.auth .sub{color:var(--mut);margin-bottom:26px}
.auth .lk{margin-top:18px;text-align:center;font-size:14px;color:var(--mut)}
.auth .lk a,.lnk{color:var(--fg);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.slugbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:calc(var(--r) - 2px);padding-left:12px;color:var(--mut);font-size:13px;overflow:hidden}
.slugbox:focus-within{border-color:var(--ac)}
.slugbox input{border:0;height:44px;background:transparent;outline:none;flex:1;min-width:0;padding:0 10px 0 2px;color:var(--fg);font-size:15px}
.ok{color:var(--ok)}.bd{color:var(--bad)}

.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px}
.tabs{display:flex;gap:2px;margin-left:8px}
.tab{padding:9px 14px;border-radius:10px;font-weight:500;color:var(--mut);position:relative;transition:.15s;font-size:14.5px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);background:rgba(255,255,255,.07)}
.tab .bg{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--ac);color:var(--acf);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.pub{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--mut)}
.pub i{width:8px;height:8px;border-radius:50%;background:var(--mut)}.pub.on i{background:var(--ok)}
@media(max-width:760px){
 .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
 .top-in{padding:10px 16px}
 .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-between;z-index:40}
 .tab{flex:1;text-align:center;padding:9px 0;font-size:11.5px}
 .pub span{display:none}
}
.wrap{max-width:1080px;margin:0 auto;padding:26px 20px 110px}
.pg-h{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.pg-h h2{font-size:24px;letter-spacing:-.03em;flex:1;min-width:140px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--mut)}
.seg button.on{background:rgba(255,255,255,.1);color:var(--fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:7px 14px;border:1px solid var(--line);border-radius:20px;font-size:13px;color:var(--mut)}
.chip.on{border-color:var(--ac);color:var(--fg);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.dn{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.dn h3{flex:1;text-align:center;font-size:16px;font-weight:600}.dn h3::first-letter{text-transform:uppercase}
.ib{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;font-size:18px;display:grid;place-items:center}
.ap{display:grid;grid-template-columns:64px 1fr auto;gap:2px 14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:10px}
.ap .hr{grid-row:span 2;font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;line-height:1.2}
.ap .hr small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.ap .nm{font-weight:600}
.ap .ds{color:var(--mut);font-size:13px;grid-column:2}
.ap .ac{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.bdg{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:12px;letter-spacing:.03em}
.bdg.pendente{background:rgba(233,176,74,.16);color:#f0bf63}
.bdg.confirmado{background:rgba(88,194,125,.15);color:var(--ok)}
.bdg.cancelado{background:rgba(229,100,92,.14);color:var(--bad)}
.ap.cancelado{opacity:.6}
.wk{display:grid;gap:18px}
.wk h4::first-letter{text-transform:uppercase}.wk h4{font-size:13px;color:var(--mut);margin-bottom:8px;letter-spacing:.04em;display:flex;gap:8px;align-items:center}
.wk h4.hj{color:var(--ac)}
.mo{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mo .h{font-size:11px;color:var(--mut);text-align:center;text-transform:uppercase;letter-spacing:.08em;padding-bottom:4px}
.mo button{aspect-ratio:1/1.05;border:1px solid var(--line);border-radius:12px;padding:6px;text-align:left;font-size:13px;display:flex;flex-direction:column;justify-content:space-between;background:var(--card);min-height:56px}
.mo button.out{opacity:.35}.mo button.hj{border-color:var(--ac)}
.mo .dts{display:flex;gap:3px;flex-wrap:wrap}
.mo .dts i{width:7px;height:7px;border-radius:50%}
.mo .dts .p{background:#f0bf63}.mo .dts .c{background:var(--ok)}
.mo small{font-size:10.5px;color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:18px;background:var(--card)}
.kpi small{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.kpi b{font-size:26px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi.ac b{color:var(--ac)}
.box{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:20px;margin-bottom:14px}
.box h3{font-size:15px;margin-bottom:14px}
.box .note{font-size:12.5px;color:var(--mut);margin-top:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.g2{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px}
.bars div{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:3px;opacity:.9;position:relative}
.bars div:hover{opacity:1}
.bars-l{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:6px}
.ls>div{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.ls>div:last-child{border:0}
.ls .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.ls .bar i{display:block;height:100%;background:var(--ac)}
.ls b{font-variant-numeric:tabular-nums}
.ls .grow{flex:1;min-width:0}
.ls small{color:var(--mut);display:block;font-size:12.5px}
.pr{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:10px}
.pr .av{width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--bg);display:grid;place-items:center;color:var(--ac);font-weight:600;flex:none;border:1px solid var(--line)}
.pr .av img{width:100%;height:100%;object-fit:cover}
.pr .tx{flex:1;min-width:0}.pr small{color:var(--mut);display:block}
.pr.off{opacity:.55}
.hd7{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hd7 .tm2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hd7 .tm2 input{height:38px;padding:0 6px;font-size:13px;text-align:center}
.hd7 label{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500}
.hd7.cl .tm2{opacity:.3;pointer-events:none}
.hd7 .cap{grid-column:2;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.sv{display:grid;grid-template-columns:1fr 90px 100px 36px;gap:8px;align-items:center;margin-bottom:8px}
.sv .inp{height:42px}
@media(max-width:620px){.sv{grid-template-columns:1fr 1fr;}.sv .n{grid-column:1/-1}}
.xb{height:42px;border:1px solid var(--line);border-radius:10px;color:var(--bad);font-size:18px}
.ap-g{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:26px;align-items:start}
@media(max-width:900px){.ap-g{grid-template-columns:1fr}}
.pvw{position:sticky;top:78px}
.pvf{height:640px;border:1px solid var(--line);border-radius:30px;padding:8px;background:#000}
@media(max-width:900px){.pvw{position:static}.pvf{height:560px}}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;outline:1px solid var(--line);outline-offset:1px}
.sw button.on{border-color:var(--bg);outline:2px solid var(--fg)}

<script>
'use strict';
/* =========================================================
   MARQUI — configuração (a chave "publishable" é pública por natureza;
   quem protege os dados são as regras do banco, não o segredo da chave)
   ========================================================= */
// ▼▼▼ ÚNICO LUGAR QUE VOCÊ PRECISA EDITAR ▼▼▼
// Supabase > Project Settings > API: copie "Project URL" e a chave "Publishable key" (sb_publishable_...).
const SB_URL = 'https://szksylrgauehjxqdzxww.supabase.co';   // ex.: https://abcdefgh.supabase.co
const SB_KEY = 'sb_publishable_31dSytCpcAtNag3gRsHZ6A_jLwOTi8v'; // ex.: sb_publishable_xxxxxxxx
// ▲▲▲ nunca use a chave "service_role" aqui ▲▲▲
const CONFIG_OK = /^https:\/\/[a-z0-9]+\.supabase\.co\/?$/.test(SB_URL) && /^(sb_publishable_|eyJ)/.test(SB_KEY);

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => Number(v || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const DIAS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = String(s).slice(0,10).split('-').map(Number); return new Date(y, m-1, d, 12); };
const addD = (s, n) => { const d = pd(s); d.setDate(d.getDate()+n); return ymd(d); };
const hoje = () => ymd(new Date());
const fmtDia = (s, o) => pd(s).toLocaleDateString('pt-BR', o || {weekday:'short', day:'2-digit', month:'short'}).replace('.', '');
const addMin = (h, m) => { const [a,b] = h.split(':').map(Number); const t = a*60+b+m; return `${pad(Math.floor(t/60)%24)}:${pad(t%60)}`; };
const initial = s => (String(s || '?').trim()[0] || '?').toUpperCase();
const safeUrl = u => /^https:\/\//.test(u || '') ? u : '';
const slugify = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30);
const maskTel = v => { let d = String(v).replace(/\D/g, '').slice(0, 11); if (!d) return ''; if (d.length > 6) return `(${d.slice(0,2)}) ${d.slice(2, d.length > 10 ? 7 : 6)}-${d.slice(d.length > 10 ? 7 : 6)}`; if (d.length > 2) return `(${d.slice(0,2)}) ${d.slice(2)}`; return `(${d}`; };
const telFmt = t => maskTel(t);
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
let toastT;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'on' + (bad ? ' bad' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', bad ? 4800 : 2600);
}
const I = {
  pin: '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  wa: '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.6-5A8.5 8.5 0 1 1 8 19.4z"/></svg>',
  ok: '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

/* ---------- sessão (Supabase Auth) ---------- */
let SESS = ls.get('mq_sess', null);
function setSess(j) {
  SESS = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000 - 60000, email: (j.user && j.user.email) || (SESS && SESS.email) || '' };
  ls.set('mq_sess', SESS);
}
function clearSess() { SESS = null; ls.del('mq_sess'); }
async function tok() {
  if (!SESS) throw semLogin();
  if (Date.now() > SESS.expires_at) {
    let r;
    try { r = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {method:'POST', headers:{apikey:SB_KEY, 'Content-Type':'application/json'}, body:JSON.stringify({refresh_token:SESS.refresh_token})}); }
    catch { throw new Error('Sem conexão com o servidor.'); }
    if (!r.ok) { clearSess(); throw semLogin(); }
    setSess(await r.json());
  }
  return SESS.access_token;
}
const semLogin = () => Object.assign(new Error('Sua sessão expirou. Entre novamente.'), {login: true});
function errMsg(j, status) {
  const m = j && (j.message || j.msg || j.error_description || j.error);
  if (j && (j.code === 'PGRST202' || j.code === '42883' || status === 404)) return 'O banco do Marqui ainda não foi instalado neste projeto. Rode o arquivo marqui.sql no SQL Editor do Supabase.';
  if (status === 401) return 'Sua sessão expirou. Entre novamente.';
  return m || 'Algo deu errado. Tente novamente.';
}
async function rpc(fn, args, auth) {
  const h = {apikey: SB_KEY, 'Content-Type': 'application/json'};
  if (auth) h.Authorization = 'Bearer ' + await tok();
  let r;
  try { r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {method:'POST', headers:h, body:JSON.stringify(args || {})}); }
  catch { throw new Error('Sem conexão com o servidor. Verifique sua internet e abra o site em um navegador (não na pré-visualização).'); }
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch {}
  if (!r.ok) {
    if (r.status === 401 && auth) { clearSess(); throw Object.assign(new Error(errMsg(j, 401)), {login: true}); }
    throw new Error(errMsg(j, r.status));
  }
  return j;
}
async function authCall(path, body, method) {
  let r;
  const h = {apikey: SB_KEY, 'Content-Type': 'application/json'};
  if (method === 'PUT') h.Authorization = 'Bearer ' + await tok();
  try { r = await fetch(SB_URL + '/auth/v1' + path, {method: method || 'POST', headers: h, body: JSON.stringify(body)}); }
  catch { throw new Error('Sem conexão com o servidor.'); }
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch {}
  if (!r.ok) {
    const c = (j && (j.error_code || j.code)) || '', m = (j && (j.msg || j.message || j.error_description)) || '';
    if (/invalid_credentials|Invalid login/i.test(c + m)) throw new Error('E-mail ou senha incorretos.');
    if (/email_not_confirmed/i.test(c + m)) throw new Error('Confirme seu e-mail antes de entrar (veja sua caixa de entrada).');
    if (/user_already_exists|already registered/i.test(c + m)) throw new Error('Este e-mail já tem cadastro. Use "Entrar".');
    if (/weak_password|at least/i.test(c + m)) throw new Error('A senha precisa ter pelo menos 6 caracteres.');
    if (/over_email_send_rate_limit|rate/i.test(c + m)) throw new Error('Muitas tentativas. Aguarde um minuto e tente de novo.');
    if (/signup_disabled|not allowed/i.test(c + m)) throw new Error('Novos cadastros estão desativados neste projeto.');
    throw new Error(m || 'Não foi possível concluir. Tente novamente.');
  }
  return j;
}

/* ---------- tema (cor, fundo, fonte, cantos) ---------- */
const FUNDOS = {
  escuro:  {n:'Preto',    bg:'#0c0c0d', fg:'#f4f1ea', card:'#151516', line:'rgba(255,255,255,.1)',  mut:'rgba(244,241,234,.58)'},
  grafite: {n:'Grafite',  bg:'#1a1b1d', fg:'#f2f0eb', card:'#232427', line:'rgba(255,255,255,.1)',  mut:'rgba(242,240,235,.58)'},
  noite:   {n:'Noite',    bg:'#0a1020', fg:'#eef2fb', card:'#111a2f', line:'rgba(255,255,255,.1)',  mut:'rgba(238,242,251,.58)'},
  claro:   {n:'Areia',    bg:'#f4f1ea', fg:'#1b1a18', card:'#ffffff', line:'rgba(0,0,0,.1)',        mut:'rgba(27,26,24,.58)'},
  branco:  {n:'Branco',   bg:'#ffffff', fg:'#111111', card:'#f5f5f4', line:'rgba(0,0,0,.1)',        mut:'rgba(17,17,17,.56)'}
};
const FONTES = {moderna: {n:'Moderna', f:"'Inter',system-ui,sans-serif"}, classica: {n:'Clássica', f:"'Playfair Display',Georgia,serif"}, impacto: {n:'Impacto', f:"'Oswald','Arial Narrow',Impact,sans-serif"}};
const CORES = ['#E9B04A','#C9A27A','#E5645C','#3FA796','#4C8DFF','#9B7BFF','#F26FA3','#E8E6E1'];
const TEMA0 = {cor:'#E9B04A', fundo:'escuro', fonte:'moderna', cantos:'suave'};
function contraste(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const L = [r, g, b].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
  return (.2126 * L[0] + .7152 * L[1] + .0722 * L[2]) > .42 ? '#111111' : '#ffffff';
}
function temaOk(t) {
  t = Object.assign({}, TEMA0, t || {});
  if (!/^#[0-9a-f]{6}$/i.test(t.cor)) t.cor = TEMA0.cor;
  if (!FUNDOS[t.fundo]) t.fundo = TEMA0.fundo;
  if (!FONTES[t.fonte]) t.fonte = TEMA0.fonte;
  if (t.cantos !== 'reto') t.cantos = 'suave';
  return t;
}
function temaVars(t) {
  t = temaOk(t); const f = FUNDOS[t.fundo];
  return `--bg:${f.bg};--fg:${f.fg};--card:${f.card};--line:${f.line};--mut:${f.mut};--ac:${t.cor};--acf:${contraste(t.cor)};--r:${t.cantos === 'reto' ? '3px' : '16px'}`;
}

/* ---------- horário de funcionamento (resumo legível) ---------- */
function horariosResumo(profs) {
  const m = {};
  (profs || []).forEach(p => (p.horarios || []).forEach(h => {
    if (!h.ativo || p.ativo === false) return;
    const c = m[h.dia_semana]; if (!c) m[h.dia_semana] = {abre: h.abre, fecha: h.fecha};
    else { if (h.abre < c.abre) c.abre = h.abre; if (h.fecha > c.fecha) c.fecha = h.fecha; }
  }));
  return Object.keys(m).map(d => ({dia_semana: +d, abre: m[d].abre, fecha: m[d].fecha}));
}
function linhasHorario(hs) {
  const by = {}; (hs || []).forEach(h => by[h.dia_semana] = h);
  const ord = [1,2,3,4,5,6,0], runs = [];
  ord.forEach(d => {
    const h = by[d], k = h ? `${h.abre} – ${h.fecha}` : 'Fechado', last = runs[runs.length - 1];
    if (last && last.k === k) last.fim = d; else runs.push({k, ini: d, fim: d, off: !h});
  });
  return runs.map(r => ({l: r.ini === r.fim ? DS[r.ini] : `${DS[r.ini]} – ${DS[r.fim]}`, v: r.k, off: r.off}));
}

/* =========================================================
   PÁGINA PÚBLICA — renderização (usada também na pré-visualização)
   ========================================================= */
function shopHTML(d, pv) {
  const t = temaOk(d.tema), logo = safeUrl(d.logo_url), capa = safeUrl(d.capa_url);

      ${!pv ? '<div><button class="mylink" data-act="meus" hidden id="mylink">Meus agendamentos</button></div>' : ''}
    </div>
  </header>
  <main class="sh-main">
    <section class="sec"><h2>Serviços</h2>
      ${svs.length ? svs.map(s => `<button class="svc" data-act="bk-open" data-sv="${esc(s.id)}"><div class="tx"><div class="svn">${esc(s.nome)}</div><div class="svd">${s.duracao_min} min${s.descricao ? ' · ' + esc(s.descricao) : ''}</div></div><div class="svp">${money(s.preco)}</div></button>`).join('') : '<div class="empty">Nenhum serviço cadastrado ainda.</div>'}

    ${linhas.length ? `<section class="sec"><h2>Horários</h2><div class="hrs">${linhas.map(l => `<div class="${l.off ? 'off' : ''}"><span>${l.l}</span><span>${esc(l.v)}</span></div>`).join('')}</div></section>` : ''}
    <div class="pw">Agendamento por <a href="${pv ? '#' : esc(location.pathname)}">Marqui</a></div>
  </main>
  <div class="ctab"><button class="btn pri big" data-act="bk-open">Agendar horário</button></div>
</div>`;
}

/* ---------- assistente de agendamento ---------- */
let SHOP = null, SLUG = '';
const BK = {};
function bkReset(sv, pr) {
  Object.assign(BK, {open: true, step: 'sv', sv: sv || null, pr: pr === undefined ? undefined : pr, dia: null, hora: null, dias: [], slots: [], diasOk: false, slotsOk: false, nome: ls.get('mq_nome', ''), tel: ls.get('mq_tel', ''), busy: false, done: null, erro: ''});
  const pr1 = SHOP.profissionais;
  if (pr1.length === 1) BK.pr = pr1[0].id;
  if (pr === undefined && pr1.length > 1) BK.pr = undefined;
}
const bkSteps = () => SHOP.profissionais.length > 1 ? ['sv', 'pr', 'dh', 'dd'] : ['sv', 'dh', 'dd'];
function bkTitle() { return {sv: 'Escolha o serviço', pr: 'Com quem?', dh: 'Dia e horário', dd: 'Seus dados', ok: 'Tudo certo'}[BK.step]; }
function bkOpen(sv, pr) {
  bkReset(sv, pr);
  if (sv && pr !== undefined) BK.step = 'dh';
  else if (sv) BK.step = SHOP.profissionais.length > 1 ? 'pr' : 'dh';
  else if (pr !== undefined) BK.step = 'sv';
  bkRender();
  if (BK.step === 'dh') loadDias();
}

  const root = $('.shop');
  if (!ov) { ov = document.createElement('div'); ov.id = 'bk'; ov.className = 'ov'; root.appendChild(ov); document.body.style.overflow = 'hidden'; ov.addEventListener('click', e => { if (e.target === ov) { BK.open = false; bkRender(); } }); }
  const steps = bkSteps(), idx = steps.indexOf(BK.step), svc = SHOP.servicos.find(s => s.id === BK.sv);

  if (BK.step === 'sv') {

  } else if (BK.step === 'pr') {
    body = `<button class="opt${BK.pr === null ? ' on' : ''}" data-act="bk-pr" data-id=""><div class="av">★</div><div class="tx"><b>Sem preferência</b><small>O primeiro horário livre da equipe</small></div></button>` +
      SHOP.profissionais.map(p => `<button class="opt${BK.pr === p.id ? ' on' : ''}" data-act="bk-pr" data-id="${esc(p.id)}"><div class="av">${safeUrl(p.foto_url) ? `<img src="${esc(p.foto_url)}" alt="">` : esc(initial(p.nome))}</div><div class="tx"><b>${esc(p.nome)}</b>${p.bio ? `<small>${esc(p.bio)}</small>` : ''}</div></button>`).join('');
  } else if (BK.step === 'dh') {
    body = !BK.diasOk ? '<div class="sk"></div><div class="sk"></div>' : `
      <div class="days" id="days">${BK.dias.map(x => `<button class="dy${BK.dia === x.dia ? ' on' : ''}" ${x.aberto ? '' : 'disabled'} data-act="bk-dia" data-d="${x.dia}"><small>${fmtDia(x.dia, {weekday: 'short'})}</small><b>${x.dia.slice(8)}</b><em>${fmtDia(x.dia, {month: 'short'})}</em></button>`).join('')}</div>
      ${BK.dia ? (!BK.slotsOk ? '<div class="sk"></div>' : (BK.slots.some(s => s.livre) ? `<div class="slots">${BK.slots.map(s => `<button class="sl${BK.hora === s.hora ? ' on' : ''}" ${s.livre ? '' : 'disabled'} data-act="bk-hora" data-h="${s.hora}">${s.hora}</button>`).join('')}</div>` : '<div class="empty">Sem horários livres neste dia. Escolha outra data.</div>')) : '<div class="empty">Selecione um dia.</div>'}`;
  } else if (BK.step === 'dd') {
    body = `<div class="sum">
      <div><span>Serviço</span><span>${esc(svc.nome)} · ${money(svc.preco)}</span></div>
      <div><span>Profissional</span><span>${prof ? esc(prof.nome) : 'Sem preferência'}</span></div>
      <div><span>Quando</span><span>${fmtDia(BK.dia, {weekday: 'long', day: '2-digit', month: 'long'})}, ${BK.hora}</span></div></div>
      <div class="field"><label for="bk-n">Seu nome</label><input id="bk-n" class="inp" autocomplete="name" maxlength="60" value="${esc(BK.nome)}" placeholder="Como podemos te chamar?"></div>

async function loadDias() {
  BK.diasOk = false; BK.dia = null; BK.hora = null; BK.slots = []; bkRender();
  try {
    BK.dias = await rpc('mq_dias', {p_slug: SLUG, p_prof: BK.pr || null});
    BK.diasOk = true;
    // escolhe o primeiro dia que realmente tem horário livre (até 10 dias à frente)
    const abertos = BK.dias.filter(x => x.aberto).slice(0, 10);
    for (const x of abertos) {
      const s = await rpc('mq_horarios', {p_slug: SLUG, p_dia: x.dia, p_servico: BK.sv, p_prof: BK.pr || null});
      if (s.some(z => z.livre)) { BK.dia = x.dia; BK.slots = s; BK.slotsOk = true; bkRender(); return; }
    }
    if (abertos[0]) { BK.dia = abertos[0].dia; bkRender(); await loadSlots(); return; }
  } catch (e) { toast(e.message, true); BK.diasOk = true; }
  bkRender();
}
async function loadSlots() {
  BK.slotsOk = false; BK.hora = null; bkRender();
  const dia = BK.dia;
  try {
    const s = await rpc('mq_horarios', {p_slug: SLUG, p_dia: dia, p_servico: BK.sv, p_prof: BK.pr || null});
    if (dia !== BK.dia) return;
    BK.slots = s;
  } catch (e) { toast(e.message, true); BK.slots = []; }
  BK.slotsOk = true; bkRender();
}
async function bkNext() {
  const steps = bkSteps(), i = steps.indexOf(BK.step);
  if (BK.step !== 'dd') {
    BK.step = steps[i + 1]; bkRender();
    if (BK.step === 'dh') loadDias();
    return;
  }
  BK.nome = ($('#bk-n').value || '').trim(); BK.tel = ($('#bk-t').value || '').replace(/\D/g, '');
  if (BK.nome.length < 2) { BK.erro = 'Informe seu nome.'; return bkRender(); }
  if (BK.tel.length < 10 || BK.tel.length > 11) { BK.erro = 'Informe o WhatsApp com DDD.'; return bkRender(); }
  BK.erro = ''; BK.busy = true; bkRender();
  try {
    const o = await rpc('mq_agendar', {p_slug: SLUG, p_servico: BK.sv, p_prof: BK.pr || null, p_nome: BK.nome, p_tel: BK.tel, p_dia: BK.dia, p_hora: BK.hora});
    ls.set('mq_nome', BK.nome); ls.set('mq_tel', BK.tel);
    const L = ls.get('mq_meus', []); L.unshift({id: o.id, slug: SLUG, tel: BK.tel}); ls.set('mq_meus', L.slice(0, 30));
    BK.done = o; BK.step = 'ok'; BK.busy = false; bkRender(); myLink();
  } catch (e) {
    BK.busy = false;
    if (/ocupado|passou|pausa|bloqueado|Hor[aá]rio/i.test(e.message)) { toast(e.message, true); BK.step = 'dh'; BK.hora = null; await loadSlots(); }
    else { BK.erro = e.message; bkRender(); }
  }
}
function bkBack() { const s = bkSteps(), i = s.indexOf(BK.step); if (i > 0) { BK.step = s[i - 1]; bkRender(); if (BK.step === 'dh') bkRender(); } }

const monday = s => { const d = pd(s), w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return ymd(d); };
function agRange() {
  const a = P.ag;
  if (a.view === 'dia') return [a.data, a.data];
  if (a.view === 'semana') { const m = monday(a.data); return [m, addD(m, 6)]; }
  const d = pd(a.data), ini = ymd(new Date(d.getFullYear(), d.getMonth(), 1, 12)), fim = ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0, 12));
  return [ini, fim];
}
async function viewAgenda() {
  V('<div class="spin"></div>'); P.ag.ok = false;
  try { const [a, b] = agRange(); P.ag.itens = await rpc('mq_agenda', {p_de: a, p_ate: b}, true); P.ag.ok = true; } catch (e) { return fail(e); }
  paintAgenda();
}
function fail(e) { if (e.login) return viewAuth('login', e.message); V(`<div class="box"><div class="err">${esc(e.message)}</div></div>`); }
function paintAgenda() {
  const a = P.ag, f = a.filtro;
  const filtrados = a.itens.filter(x => f === 'todos' ? true : x.status === ({pendentes: 'pendente', confirmados: 'confirmado', cancelados: 'cancelado'})[f]);
  const lbl = a.view === 'dia' ? fmtDia(a.data, {weekday: 'long', day: '2-digit', month: 'long'}) : a.view === 'semana' ? `${fmtDia(monday(a.data), {day: '2-digit', month: 'short'})} – ${fmtDia(addD(monday(a.data), 6), {day: '2-digit', month: 'short'})}` : pd(a.data).toLocaleDateString('pt-BR', {month: 'long', year: 'numeric'});
  const step = a.view === 'dia' ? 1 : a.view === 'semana' ? 7 : 0;
  let corpo = '';
  if (a.view === 'dia') corpo = filtrados.length ? filtrados.map(apHTML).join('') : '<div class="empty">Nenhum agendamento neste dia.</div>';
  else if (a.view === 'semana') {
    const m = monday(a.data);

let upKind = '';
function pickFile(kind, cb) {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/jpeg,image/png,image/webp'; i.style.display = 'none';
  i.onchange = async () => { const f = i.files[0]; i.remove(); if (!f) return; try { toast('Enviando imagem…'); cb(await subir(f, kind)); toast('Imagem enviada.'); } catch (e) { toast(e.message, true); } };
  document.body.appendChild(i); i.click();
}
function resizeImg(file, max, png) {
  return new Promise((res, rej) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k)); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error('Não foi possível processar a imagem.')), png ? 'image/png' : 'image/jpeg', .86); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Arquivo de imagem inválido.')); };
    im.src = u;
  });
}
async function subir(file, kind) {
  if (file.size > 15 * 1024 * 1024) throw new Error('Imagem muito grande (máx. 15 MB).');
  const png = kind === 'logo' || kind === 'foto', blob = await resizeImg(file, kind === 'capa' ? 1800 : kind === 'gal' ? 1100 : 600, png);
  if (blob.size > 5 * 1024 * 1024) throw new Error('Imagem ainda muito pesada após ajuste. Use uma menor.');
  const path = `${P.b.id}/${kind}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${png ? 'png' : 'jpg'}`;
  let r;
  try { r = await fetch(`${SB_URL}/storage/v1/object/marqui/${path}`, {method: 'POST', headers: {apikey: SB_KEY, Authorization: 'Bearer ' + await tok(), 'Content-Type': png ? 'image/png' : 'image/jpeg', 'x-upsert': 'false'}, body: blob}); }
  catch (e) { if (e.login) throw e; throw new Error('Sem conexão ao enviar a imagem.'); }
  if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch {} throw new Error(/bucket/i.test(m || '') ? 'O armazenamento de imagens não foi criado. Rode o marqui.sql de novo.' : (m || 'Falha ao enviar a imagem.')); }
  return `${SB_URL}/storage/v1/object/public/marqui/${path}`;
}

    <div class="cp"><input class="inp" readonly value="${esc(u)}" id="lk-u" aria-label="Link público"><button class="btn" data-act="cp">Copiar</button><a class="btn" target="_blank" rel="noopener" href="${esc(u)}">Abrir</a></div></div>
  <div class="box"><h3>Dados e regras</h3>
    <div class="field"><label>Link próprio</label><div class="slugbox"><span>…?b=</span><input id="j-s" maxlength="30" value="${esc(b.slug)}" autocapitalize="off" spellcheck="false"></div><div class="hint" id="j-sh">Mudar o link invalida o endereço antigo.</div></div>
    <div class="field"><label>WhatsApp (recebe o aviso de novos pedidos)</label><input id="j-w" class="inp" inputmode="tel" value="${esc(maskTel((b.whatsapp || '').replace(/^55/, '')))}" placeholder="(00) 00000-0000"></div>
    <div class="field"><label>Endereço</label><input id="j-e" class="inp" maxlength="200" value="${esc(b.endereco || '')}" placeholder="Rua, número, bairro, cidade"></div>
    <div class="row"><div class="field"><label>Intervalo entre horários</label><select id="j-i" class="inp">${[15, 20, 30, 40, 45, 60].map(v => `<option value="${v}" ${b.intervalo_min === v ? 'selected' : ''}>${v} min</option>`).join('')}</select></div>
    <div class="field"><label>Agenda aberta por</label><select id="j-f" class="inp">${[7, 14, 21, 30, 60, 90].map(v => `<option value="${v}" ${b.dias_futuros === v ? 'selected' : ''}>${v} dias</option>`).join('')}</select></div></div>
    <button class="btn pri" data-act="aj-save">Salvar ajustes</button></div>
  <div class="box"><h3>Folgas e bloqueios</h3>
    <div class="row"><div class="field"><label>Dia</label><input id="b-d" class="inp" type="date" value="${hoje()}"></div><div class="field"><label>Profissional</label><select id="b-p" class="inp"><option value="">Toda a barbearia</option>${b.profissionais.filter(p => p.ativo).map(p => `<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></div></div>
    <div class="row"><div class="field"><label>De (opcional)</label><input id="b-i" class="inp" type="time"></div><div class="field"><label>Até (opcional)</label><input id="b-f" class="inp" type="time"></div></div>
    <div class="field"><label>Motivo (opcional)</label><input id="b-m" class="inp" maxlength="60" placeholder="Ex.: Feriado"></div>
    <button class="btn" data-act="bl-add">Bloquear</button><p class="hint" style="margin-top:8px">Sem horário = dia inteiro.</p>
    <div class="ls" style="margin-top:14px">${b.bloqueios.length ? b.bloqueios.map(k => `<div><span class="grow">${fmtDia(k.dia, {weekday: 'short', day: '2-digit', month: 'short'})}${k.hora_ini ? ` · ${k.hora_ini}–${k.hora_fim}` : ' · dia todo'}<small>${k.profissional_id ? esc((b.profissionais.find(p => p.id === k.profissional_id) || {}).nome || '') : 'Toda a barbearia'}${k.motivo ? ' · ' + esc(k.motivo) : ''}</small></span><button class="btn sm bad" data-act="bl-del" data-id="${k.id}">Remover</button></div>`).join('') : '<div class="hint">Nenhum bloqueio futuro.</div>'}</div></div>
  <div class="box"><h3>Conta</h3><p class="hint" style="margin-bottom:12px">${esc((SESS && SESS.email) || '')}</p><button class="btn" data-act="logout">Sair</button></div>`);
  const w = $('#j-w'); w.oninput = () => w.value = maskTel(w.value);
  const s = $('#j-s'), h = $('#j-sh'); let tc;
  s.oninput = () => { s.value = s.value.toLowerCase().replace(/[^a-z0-9-]/g, ''); clearTimeout(tc); if (s.value === b.slug) { h.className = 'hint'; h.textContent = 'Mudar o link invalida o endereço antigo.'; return; } tc = setTimeout(async () => { try { const r = await rpc('mq_slug_disponivel', {p_slug: s.value}); h.className = 'hint ' + (r.ok ? 'ok' : 'bd'); h.textContent = r.ok ? 'Link disponível.' : r.motivo; } catch {} }, 350); };
}

/* =========================================================
   AÇÕES (delegação de eventos)
   ========================================================= */
async function run(fn) { try { await fn(); } catch (e) { if (e.login) { viewAuth('login', e.message); } else toast(e.message, true); } }
const ACT = {
  'go-login': () => viewAuth('login'), 'go-signup': () => viewAuth('signup'), 'go-recover': () => viewAuth('recover'),
  logout: () => { clearSess(); clearInterval(pollT); P.b = null; P.dr = null; viewLanding(); closeModal(); },
  'modal-x': closeModal,
  'modal-bg': (t, e) => { if (e.target === t) closeModal(); },
  /* público */
  'bk-open': t => { if (t.closest('.pv') || !SHOP) return; bkOpen(t.dataset.sv, t.dataset.pr); },
  'bk-close': () => { BK.open = false; bkRender(); },
  'bk-sv': t => { BK.sv = t.dataset.id; bkRender(); },
  'bk-pr': t => { BK.pr = t.dataset.id || null; BK.hora = null; bkRender(); },
  'bk-dia': t => { BK.dia = t.dataset.d; loadSlots(); },
  'bk-hora': t => { BK.hora = t.dataset.h; bkRender(); },
  'bk-next': () => bkNext(), 'bk-back': () => bkBack(),
  meus: () => meus(),
  'meu-cancel': t => run(async () => { if (!confirm('Cancelar este agendamento?')) return; await rpc('mq_cancelar', {p_id: t.dataset.id, p_tel: t.dataset.tel}); toast('Agendamento cancelado.'); meus(); }),
  /* painel */
  tab: t => goTab(t.dataset.t),
  'ag-view': t => { P.ag.view = t.dataset.v; run(viewAgenda); },
  'ag-nav': t => { const n = +t.dataset.n, a = P.ag; if (a.view === 'dia') a.data = addD(a.data, n); else if (a.view === 'semana') a.data = addD(a.data, 7 * n); else { const d = pd(a.data); a.data = ymd(new Date(d.getFullYear(), d.getMonth() + n, 1, 12)); } run(viewAgenda); },
  'ag-hoje': () => { P.ag.data = hoje(); run(viewAgenda); },
  'ag-f': t => { P.ag.filtro = t.dataset.f; paintAgenda(); },
  'ag-dia': t => { P.ag.data = t.dataset.d; P.ag.view = 'dia'; run(viewAgenda); },
  st: t => run(async () => { await rpc('mq_status', {p_id: t.dataset.id, p_status: t.dataset.s}, true); toast(t.dataset.s === 'confirmado' ? 'Confirmado.' : 'Cancelado.'); await refreshPend(); await viewAgenda(); }),
  del: t => run(async () => { if (!confirm('Excluir definitivamente este agendamento?')) return; await rpc('mq_excluir', {p_id: t.dataset.id}, true); toast('Excluído.'); await viewAgenda(); }),
  manual: () => { if (!P.b.servicos.length) return toast('Cadastre um serviço primeiro.', true); manualModal(); },
  'manual-ok': () => run(async () => {
    const er = $('#m-e'); er.hidden = true;
    try {
      await rpc('mq_agendar_manual', {p_servico: $('#m-s').value, p_prof: $('#m-p').value, p_nome: $('#m-n').value, p_tel: $('#m-t').value.replace(/\D/g, ''), p_dia: $('#m-d').value, p_hora: $('#m-h').value, p_status: $('#m-st').value}, true);
    } catch (e) { if (e.login) throw e; er.textContent = e.message; er.hidden = false; return; }
    P.ag.data = $('#m-d').value; P.ag.view = 'dia'; closeModal(); toast('Agendamento criado.'); await refreshPend(); await viewAgenda();
  }),
  'rel-per': t => { P.rel.per = t.dataset.p; run(viewResumo); },
  'pf-edit': t => pfModal(t.dataset.id),
  'pf-foto': () => pickFile('foto', u => { P.pfFoto = u; $('#p-th').innerHTML = `<img src="${esc(u)}" alt="">`; }),
  'pf-foto-x': () => { P.pfFoto = ''; $('#p-th').textContent = 'Foto'; },
  'pf-save': () => run(async () => {
    const er = $('#p-e'); er.hidden = true;
    const hs = [...document.querySelectorAll('.hd7[data-d]')].map(r => ({dia_semana: +r.dataset.d, ativo: r.querySelector('.h-a').checked, abre: r.querySelector('.h-o').value, fecha: r.querySelector('.h-f').value, pausa_inicio: r.querySelector('.h-pi').value || null, pausa_fim: r.querySelector('.h-pf').value || null}));
    const com = num($('#p-c').value || '0');
    if (isNaN(com)) { er.textContent = 'Comissão inválida.'; er.hidden = false; return; }
    try {
      const id = await rpc('mq_salvar_profissional', {p_dados: {id: $('#p-id').value || null, nome: $('#p-n').value, bio: $('#p-b').value, foto_url: P.pfFoto || '', comissao_pct: com, ativo: $('#p-a').value === '1'}}, true);
      await rpc('mq_salvar_horarios', {p_prof: id, p_horarios: hs}, true);
    } catch (e) { if (e.login) throw e; er.textContent = e.message; er.hidden = false; return; }
    closeModal(); toast('Profissional salvo.'); P.b = await rpc('mq_minha_barbearia', {}, true); viewEquipe();
  }),
  'sv-add': () => { $('#svl').insertAdjacentHTML('beforeend', svRow({})); const r = $('#svl').lastElementChild; r.querySelector('.s-n').focus(); },
  'sv-del': t => t.closest('.sv').remove(),
  'sv-save': () => run(async () => {
    const lst = [...document.querySelectorAll('#svl .sv')].map(r => ({id: r.dataset.id || null, nome: r.querySelector('.s-n').value.trim(), duracao_min: +r.querySelector('.s-d').value, preco: num(r.querySelector('.s-p').value)}));
    if (lst.some(s => !s.nome)) return toast('Todo serviço precisa de um nome.', true);
    if (lst.some(s => isNaN(s.preco) || s.preco < 0)) return toast('Confira os preços.', true);
    if (lst.some(s => !(s.duracao_min >= 5 && s.duracao_min <= 480))) return toast('Duração entre 5 e 480 minutos.', true);
    await rpc('mq_salvar_servicos', {p_servicos: lst}, true); P.b = await rpc('mq_minha_barbearia', {}, true); toast('Serviços salvos.'); viewServicos();
  }),
  tema: t => { drInit(); P.dr.tema[t.dataset.k] = t.dataset.v; const sc = window.scrollY; viewAparencia(); window.scrollTo(0, sc); },
  up: t => { const k = t.dataset.k; pickFile(k, u => { drInit(); if (k === 'logo') P.dr.logo_url = u; else if (k === 'capa') P.dr.capa_url = u; else P.dr.galeria.push(u); const sc = window.scrollY; viewAparencia(); window.scrollTo(0, sc); }); },
  'up-x': t => { drInit(); P.dr[t.dataset.k === 'logo' ? 'logo_url' : 'capa_url'] = ''; const sc = window.scrollY; viewAparencia(); window.scrollTo(0, sc); },
  'gal-x': t => { drInit(); P.dr.galeria.splice(+t.dataset.i, 1); const sc = window.scrollY; viewAparencia(); window.scrollTo(0, sc); },
  'ap-save': () => run(async () => {
    drInit(); const d = P.dr;
    if ((d.nome || '').trim().length < 2) return toast('Informe o nome da barbearia.', true);
    await rpc('mq_salvar_barbearia', {p_dados: {nome: d.nome, descricao: d.descricao, logo_url: d.logo_url || '', capa_url: d.capa_url || '', galeria: d.galeria, tema: d.tema}}, true);
    P.b = await rpc('mq_minha_barbearia', {}, true); P.dr = null; toast('Aparência salva.');
    if (P.novo && !P.b.publicada) { P.novo = false; toast('Salvo! Agora publique em Ajustes.'); }
    viewAparencia();
  }),
  pub: () => run(async () => { const v = !P.b.publicada; await rpc('mq_publicar', {p_publicar: v}, true); P.b.publicada = v; $('#pubst').className = 'pub' + (v ? ' on' : ''); $('#pubst span').textContent = v ? 'Página no ar' : 'Rascunho'; toast(v ? 'Página publicada!' : 'Página despublicada.'); viewAjustes(); }),
  cp: () => { const i = $('#lk-u'); i.select(); (navigator.clipboard ? navigator.clipboard.writeText(i.value) : Promise.reject()).then(() => toast('Link copiado.'), () => { document.execCommand && document.execCommand('copy'); toast('Link copiado.'); }); },
  'aj-save': () => run(async () => {
    const w = $('#j-w').value.replace(/\D/g, '');
    const r = await rpc('mq_salvar_barbearia', {p_dados: {slug: $('#j-s').value, whatsapp: w, endereco: $('#j-e').value, intervalo_min: +$('#j-i').value, dias_futuros: +$('#j-f').value}}, true);
    P.b = await rpc('mq_minha_barbearia', {}, true); toast('Ajustes salvos.'); viewAjustes();
  }),
  'bl-add': () => run(async () => {
    await rpc('mq_bloquear', {p_dados: {dia: $('#b-d').value, profissional_id: $('#b-p').value || null, hora_ini: $('#b-i').value || null, hora_fim: $('#b-f').value || null, motivo: $('#b-m').value}}, true);
    P.b = await rpc('mq_minha_barbearia', {}, true); toast('Bloqueado.'); viewAjustes();
  }),
  'bl-del': t => run(async () => { await rpc('mq_remover_bloqueio', {p_id: t.dataset.id}, true); P.b = await rpc('mq_minha_barbearia', {}, true); viewAjustes(); })
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const f = ACT[t.dataset.act]; if (!f) return;
  if (t.tagName === 'A' && !t.dataset.act) return;
  if (t.closest('.pv') && t.dataset.act !== 'tema') { e.preventDefault(); return; }
  f(t, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (BK.open) { BK.open = false; bkRender(); } else if ($('#modal').firstChild) closeModal(); } });

/* =========================================================
   INÍCIO
   ========================================================= */
async function boot() {
  if (!CONFIG_OK) { $('#app').innerHTML = '<div class="auth"><span class="wm"><span class="sr">Marqui</span></span><h2>Falta conectar o Supabase</h2><p class="sub">Abra o arquivo index.html em um editor de texto e preencha <b>SB_URL</b> e <b>SB_KEY</b> no começo do script, com os dados do seu projeto (Project Settings → API).</p></div>'; return; }
  const q = new URLSearchParams(location.search); SLUG = (q.get('b') || '').toLowerCase().trim();
  // retorno de e-mail (confirmação / recuperação de senha)
  if (location.hash.includes('access_token=') || location.hash.includes('error_description=')) {
    const h = new URLSearchParams(location.hash.slice(1)); history.replaceState(null, '', location.pathname + location.search);
    if (h.get('error_description')) { viewAuth('login', 'O link expirou ou já foi usado. Entre ou peça outro.'); return; }
    setSess({access_token: h.get('access_token'), refresh_token: h.get('refresh_token'), expires_in: +h.get('expires_in') || 3600});
    try { const u = await (await fetch(SB_URL + '/auth/v1/user', {headers: {apikey: SB_KEY, Authorization: 'Bearer ' + SESS.access_token}})).json(); SESS.email = u.email || ''; ls.set('mq_sess', SESS); } catch {}
    if (h.get('type') === 'recovery') return viewAuth('newpass');
  }
  if (SLUG) return loadShop();
  if (SESS) return loadPainel();
  viewLanding();
}
boot();
</script>
